name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            archive: findout-client-linux-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            archive: findout-client-windows-x86_64.zip
          - name: macOS Apple Silicon
            os: macos-15
            arch: aarch64
            archive: findout-client-macos-aarch64.dmg
          - name: macOS Intel
            os: macos-15-intel
            arch: x86_64
            archive: findout-client-macos-x86_64.dmg
    runs-on: ${{ matrix.os }}
    env:
      FINDOUT_API_ORIGIN: ${{ vars.FINDOUT_API_ORIGIN }}
      FINDOUT_GITHUB_REPOSITORY: ${{ github.repository }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-3-dev

      - name: Check release configuration
        shell: bash
        run: |
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "v${package_version}" = "${GITHUB_REF_NAME}"
          fi
          test -n "${FINDOUT_API_ORIGIN}"

      - name: Test
        run: cargo test --locked

      - name: Check optional features
        run: cargo check --locked --all-features

      - name: Build
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --locked --release

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/findout-client dist/findout-client-linux-x86_64
          tar -czf "dist/${{ matrix.archive }}" -C target/release findout-client

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/findout-client.exe dist/findout-client-windows-x86_64.exe
          Compress-Archive -Path target/release/findout-client.exe -DestinationPath "dist/${{ matrix.archive }}"

      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"

      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          MAC_ARCH: ${{ matrix.arch }}
        run: |
          expected_arch="${MAC_ARCH/aarch64/arm64}"
          lipo target/release/findout-client -verify_arch "${expected_arch}"
          codesign --force --sign - target/release/findout-client
          codesign --verify --strict target/release/findout-client
          python3 scripts/package-macos.py --arch "${MAC_ARCH}" --smoke-test
          plutil -lint dist/FindOut.app/Contents/Info.plist
          rm -r dist/FindOut.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: findout-client-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=()
          for asset in dist/*; do
            case "$(basename "$asset")" in
              findout-client-macos-aarch64.dmg) label="Mac app - Apple Silicon (DMG installer)" ;;
              findout-client-macos-x86_64.dmg) label="Mac app - Intel (DMG installer)" ;;
              findout-client-macos-aarch64) label="Automatic updater only - Apple Silicon - not the app download" ;;
              findout-client-macos-x86_64) label="Automatic updater only - Intel - not the app download" ;;
              *) label="" ;;
            esac
            assets+=("${asset}${label:+#${label}}")
          done
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --verify-tag --generate-notes
