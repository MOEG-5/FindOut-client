name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            archive: findout-client-linux-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            archive: findout-client-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    env:
      FINDOUT_API_ORIGIN: ${{ vars.FINDOUT_API_ORIGIN }}
      FINDOUT_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-3-dev

      - name: Check release configuration
        shell: bash
        run: |
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "v${package_version}" = "${GITHUB_REF_NAME}"
          test -n "${FINDOUT_API_ORIGIN}"

      - name: Build
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --locked --release

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}" -C target/release findout-client

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/findout-client.exe -DestinationPath "dist/${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: findout-client-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
