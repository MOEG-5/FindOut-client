[package]
name = "findout-client"
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-only"
description = "Minimal native desktop client for FindOut"

[features]
default = []
dev-metrics = []

[dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
    "unstable-winit-030",
] }
global-hotkey = "0.6"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = "4"
url = "2"
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = "3"
os_info = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSScreen", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
